<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎹 ピアノれんしゅう</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Zen+Maru+Gothic:wght@400;700&display=swap');
:root{
  --pink:#FF8FAB;--pink-light:#FFD6E0;--pink-soft:#FFF0F5;
  --yellow:#FFD166;--mint:#06D6A0;--sky:#74B3CE;--purple:#C77DFF;
  --bg:#FFF8FB;--text:#3D2B3D;--text-soft:#9B7FA6;
  --shadow:0 4px 20px rgba(200,100,150,0.12);--radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Zen Maru Gothic',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;}
.screen{display:none;position:relative;z-index:1;}.screen.active{display:block;}
.app-header{background:white;padding:13px 16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(200,100,150,0.1);position:sticky;top:0;z-index:100;}
.app-header h1{font-size:17px;font-weight:900;color:var(--pink);font-family:'Nunito',sans-serif;}
.main-wrap{padding-bottom:88px;}
.content{padding:14px;max-width:480px;margin:0 auto;}

/* THEME */
.theme-card{background:white;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.theme-card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;}
.theme-btns{display:flex;gap:8px;}
.theme-btn{flex:1;background:#F9F0FB;border:3px solid #F0E0F0;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .2s;}
.theme-btn.selected{border-color:var(--pink);background:var(--pink-soft);}
.theme-btn .te{font-size:26px;display:block;margin-bottom:3px;}
.theme-btn .tl{font-size:10px;font-weight:700;color:var(--text);}
.theme-locked{font-size:11px;color:var(--text-soft);text-align:center;margin-top:8px;}

/* PRACTICE INPUT */
.prac-card{background:white;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center;}
.prac-card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;}
.rarity-hint{font-size:11px;color:var(--text-soft);margin-bottom:14px;line-height:1.6;}
.minutes-input-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;}
.minutes-input{width:90px;border:3px solid #F0E0F0;border-radius:16px;padding:12px;font-size:28px;font-weight:900;font-family:'Nunito',sans-serif;text-align:center;outline:none;color:var(--text);transition:border .2s;}
.minutes-input:focus{border-color:var(--pink);}
.minutes-unit{font-size:20px;font-weight:700;color:var(--text-soft);}
.presets{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.preset-btn{background:var(--pink-soft);border:2px solid var(--pink-light);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--pink);cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;transition:all .2s;}
.preset-btn:active{background:var(--pink);color:white;}
.rarity-bar{display:flex;gap:6px;margin-bottom:14px;border-radius:12px;overflow:hidden;background:#F0E0F0;height:8px;}
.rarity-fill{height:100%;border-radius:12px;transition:width .3s;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--pink));}
.finish-btn{width:100%;background:linear-gradient(135deg,var(--pink),var(--purple));color:white;border:none;border-radius:18px;padding:15px;font-size:16px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(200,100,200,.4);transition:all .2s;}
.finish-btn:disabled{opacity:.4;cursor:not-allowed;}

/* WEEK */
.week-card{background:white;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.week-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:11px;}
.week-grid{display:flex;gap:5px;justify-content:center;}
.day-cell{flex:1;text-align:center;}
.day-label{font-size:10px;color:var(--text-soft);margin-bottom:4px;font-weight:700;}
.day-circle{width:36px;height:36px;border-radius:50%;border:3px solid #F0E0F0;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s;background:#FAFAFA;}
.day-circle.done{background:linear-gradient(135deg,var(--yellow),var(--pink));border-color:var(--yellow);box-shadow:0 3px 9px rgba(255,200,100,.4);}
.day-circle.today{border-color:var(--pink);background:var(--pink-soft);}
.week-msg{font-size:11px;color:var(--text-soft);text-align:center;margin-top:8px;}

/* CELEBRATION */
.celebration{position:fixed;inset:0;background:rgba(255,240,250,.97);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px;}
.celebration.show{display:flex;}
.cel-got{font-size:18px;color:var(--text-soft);margin-bottom:6px;}
.cel-char{font-size:100px;animation:celebrate .8s cubic-bezier(.34,1.56,.64,1);margin-bottom:6px;}
@keyframes celebrate{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.cel-rarity{font-size:14px;font-weight:700;margin-bottom:6px;}
.cel-name{font-size:22px;font-weight:900;color:var(--text);font-family:'Nunito',sans-serif;margin-bottom:4px;}
.cel-msg{font-size:13px;color:var(--text-soft);margin-bottom:20px;}
.confetti-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.confetti-piece{position:absolute;border-radius:3px;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.back-btn{background:linear-gradient(135deg,var(--pink),var(--purple));color:white;border:none;border-radius:20px;padding:14px 36px;font-size:15px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(200,100,200,.4);}

/* COLLECTION */
.col-header{background:linear-gradient(135deg,var(--pink),var(--purple));border-radius:var(--radius);padding:18px;color:white;text-align:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(200,100,200,.3);}
.col-header h2{font-size:19px;font-weight:900;font-family:'Nunito',sans-serif;}
.col-header p{font-size:12px;opacity:.9;margin-top:3px;}
.scene-card{background:white;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.scene-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.scene-count{font-size:12px;font-weight:700;color:var(--pink);}
.scene-box{border-radius:14px;min-height:130px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;padding:14px;gap:6px;margin-bottom:10px;}
.scene-item{font-size:28px;animation:dropIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes dropIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

/* RARITY LEGEND */
.rarity-legend{background:#FFF8FB;border-radius:14px;padding:12px;margin-bottom:14px;}
.rarity-legend-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;}
.rarity-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);margin-bottom:5px;}
.rarity-badge{border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;}
.badge-normal{background:#F0E0F0;color:#9B7FA6;}
.badge-rare{background:var(--yellow-light,#FFF3CC);color:#B07800;}
.badge-super{background:linear-gradient(90deg,#FF8FAB,#C77DFF);color:white;}

/* CALENDAR */
.month-cal-card{background:white;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.month-cal-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.month-count{font-size:12px;color:var(--pink);font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-day-lbl{font-size:9px;color:#9B7FA6;font-weight:700;padding:2px 0;}
.cal-day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:#F5F0F8;color:#C0A0C0;font-weight:700;font-size:10px;}
.cal-day.done{background:linear-gradient(135deg,var(--pink),var(--purple));color:white;}
.cal-day.today-mark{outline:2px solid var(--pink);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;padding:7px 30px 18px;display:flex;gap:10px;box-shadow:0 -4px 20px rgba(200,100,150,.1);z-index:50;}
.nav-tab{flex:1;background:none;border:none;border-radius:14px;padding:8px 4px;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;font-size:10px;color:var(--text-soft);transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-tab .ni{font-size:22px;}
.nav-tab.active{background:var(--pink-soft);color:var(--pink);}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="app-header"><h1>🎹 ピアノれんしゅう</h1></div>
  <div class="main-wrap"><div class="content">

    <!-- テーマ -->
    <div class="theme-card">
      <div class="theme-card-title" id="theme-title">🎨 今月のテーマをえらぼう</div>
      <div class="theme-btns" id="theme-btns"></div>
      <div class="theme-locked" id="theme-locked"></div>
    </div>

    <!-- 練習入力 -->
    <div class="prac-card">
      <div class="prac-card-title">⏱️ きょうのれんしゅうじかん</div>
      <div class="minutes-input-wrap">
        <input type="number" class="minutes-input" id="minutes-input" placeholder="0" min="1" max="999" oninput="updateFinBtn()">
        <span class="minutes-unit">ふん</span>
      </div>
      <div class="presets">
        <button class="preset-btn" onclick="setMin(5)">5ふん</button>
        <button class="preset-btn" onclick="setMin(10)">10ふん</button>
        <button class="preset-btn" onclick="setMin(15)">15ふん</button>
        <button class="preset-btn" onclick="setMin(20)">20ふん</button>
        <button class="preset-btn" onclick="setMin(30)">30ふん</button>
        <button class="preset-btn" onclick="setMin(45)">45ふん</button>
        <button class="preset-btn" onclick="setMin(60)">60ふん</button>
      </div>
      <button class="finish-btn" id="finish-btn" onclick="finishPractice()" disabled>✅ れんしゅうかんりょう！</button>
    </div>

    <!-- 週カレンダー -->
    <div class="week-card">
      <div class="week-title">📅 こんしゅうのれんしゅう</div>
      <div class="week-grid" id="week-grid"></div>
      <div class="week-msg" id="week-msg"></div>
    </div>

  </div></div>
  <div class="bottom-nav">
    <button class="nav-tab active" onclick="showScreen('home')"><span class="ni">🏠</span>ホーム</button>
    <button class="nav-tab" onclick="showScreen('collection')"><span class="ni">🌸</span>コレクション</button>
  </div>
</div>

<!-- COLLECTION -->
<div class="screen" id="screen-collection">
  <div class="app-header"><h1>🌸 コレクション</h1></div>
  <div class="main-wrap"><div class="content">

    <div class="col-header">
      <h2 id="col-title">おはなばたけ</h2>
      <p id="col-sub">れんしゅうするたびにキャラクターがもらえるよ！</p>
    </div>

    <!-- レアリティ説明 -->
    <div class="rarity-legend">
      <div class="rarity-legend-title">🎯 キャラクターのレアリティ</div>
      <div id="rarity-legend-content"></div>
    </div>

    <div class="scene-card">
      <div class="scene-title">
        <span id="col-scene-name">🌸 今月のコレクション</span>
        <span class="scene-count" id="col-count">0こ</span>
      </div>
      <div class="scene-box" id="col-scene-box"></div>
    </div>

    <!-- 月カレンダー -->
    <div class="month-cal-card">
      <div class="month-cal-title">
        <span id="cal-month-label">今月のきろく</span>
        <span class="month-count" id="cal-month-count"></span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

  </div></div>
  <div class="bottom-nav">
    <button class="nav-tab" onclick="showScreen('home')"><span class="ni">🏠</span>ホーム</button>
    <button class="nav-tab active" onclick="showScreen('collection')"><span class="ni">🌸</span>コレクション</button>
  </div>
</div>

<!-- CELEBRATION -->
<div class="celebration" id="celebration">
  <div class="confetti-wrap" id="confetti-wrap"></div>
  <div class="cel-got">✨ ゲット！</div>
  <div class="cel-char" id="cel-char">🌸</div>
  <div class="cel-rarity" id="cel-rarity"></div>
  <div class="cel-name" id="cel-name"></div>
  <div class="cel-msg" id="cel-msg"></div>
  <button class="back-btn" onclick="hideCel()">🏠 ホームにもどる</button>
</div>

<script>
// ===== キャラクターデータ =====
const CHARS = {
  flower:{
    normal:[ {e:'🌸',n:'さくら'},{e:'🌼',n:'ひまわり'},{e:'🌹',n:'ばら'},{e:'🌷',n:'チューリップ'},{e:'🌻',n:'たんぽぽ'},{e:'🌾',n:'コスモス'} ],
    rare:  [ {e:'🪷',n:'はすのはな'},{e:'🌺',n:'ハイビスカス'},{e:'🏵️',n:'かんむりばな'} ],
    super: [ {e:'🏆',n:'トロフィー'},{e:'🏆',n:'トロフィー'},{e:'🏆',n:'トロフィー'} ]
  },
  animal:{
    normal:[ {e:'🐱',n:'ねこ'},{e:'🐶',n:'いぬ'},{e:'🐰',n:'うさぎ'},{e:'🐸',n:'かえる'},{e:'🐹',n:'ハムスター'},{e:'🐧',n:'ペンギン'} ],
    rare:  [ {e:'🦊',n:'きつね'},{e:'🐼',n:'パンダ'},{e:'🦁',n:'ライオン'} ],
    super: [ {e:'🏆',n:'トロフィー'},{e:'🏆',n:'トロフィー'},{e:'🏆',n:'トロフィー'} ]
  },
  veggie:{
    normal:[ {e:'🥕',n:'にんじん'},{e:'🥦',n:'ブロッコリー'},{e:'🌽',n:'とうもろこし'},{e:'🍅',n:'トマト'},{e:'🥬',n:'レタス'},{e:'🥒',n:'きゅうり'} ],
    rare:  [ {e:'🫑',n:'カラーピーマン'},{e:'🍆',n:'なす'},{e:'🥑',n:'アボカド'} ],
    super: [ {e:'🏆',n:'トロフィー'},{e:'🏆',n:'トロフィー'},{e:'🏆',n:'トロフィー'} ]
  },
  ocean:{
    normal:[ {e:'🐠',n:'クマノミ'},{e:'🐟',n:'さかな'},{e:'🦐',n:'えび'},{e:'🐚',n:'かい'},{e:'🫧',n:'あわ'},{e:'🐡',n:'ふぐ'} ],
    rare:  [ {e:'🐬',n:'イルカ'},{e:'🦑',n:'イカ'},{e:'🐙',n:'タコ'} ],
    super: [ {e:'🏆',n:'トロフィー'},{e:'🏆',n:'トロフィー'},{e:'🏆',n:'トロフィー'} ]
  }
};

const TYPES = {
  flower:{label:'おはな',emoji:'🌸',scene:{name:'おはなばたけ',bg:'linear-gradient(160deg,#ffecd2,#fcb69f,#ff9a9e)'}},
  animal:{label:'どうぶつ',emoji:'🐾',scene:{name:'どうぶつえん',bg:'linear-gradient(160deg,#d4fc79,#96e6a1)'}},
  veggie:{label:'やさい',emoji:'🥦',scene:{name:'げんきサラダ',bg:'linear-gradient(160deg,#f9f047,#0fd850)'}},
  ocean: {label:'うみ',emoji:'🐠',scene:{name:'すいぞくかん',bg:'linear-gradient(160deg,#43b89c,#0575e6,#021b79)'}},
};
const TYPE_KEYS = Object.keys(TYPES);
const DAYS_JA = ['日','月','火','水','木','金','土'];

// ===== DATA =====
function getData(){
  const d=localStorage.getItem('piano_v6');
  return d?JSON.parse(d):{type:'flower',themeMonth:'',practiceLog:{},collectionLog:{},lastPractice:null,streak:0,totalMinutes:0};
}
function save(d){localStorage.setItem('piano_v6',JSON.stringify(d));}
function today(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;}
function thisMonth(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;}

let D=getData(), curType=D.type||'flower';

// レアリティを分数から判定
function getRarity(mins){
  if(mins>=30) return 'super';
  if(mins>=20) return 'rare';
  return 'normal';
}

// ランダムキャラ取得
function getRandomChar(type, rarity){
  const list=CHARS[type][rarity];
  return list[Math.floor(Math.random()*list.length)];
}

// ===== INIT =====
window.onload=()=>{renderHome();};

// ===== SCREENS =====
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='home') renderHome();
  if(name==='collection') renderCollection();
}

// ===== HOME =====
function renderHome(){
  D=getData(); curType=D.type||'flower';
  renderTheme();
  renderWeekGrid();
  document.getElementById('minutes-input').value='';
  updateFinBtn();
}

function renderTheme(){
  const locked=D.themeMonth===thisMonth();
  const container=document.getElementById('theme-btns');
  container.innerHTML='';
  TYPE_KEYS.forEach(k=>{
    const t=TYPES[k];
    const btn=document.createElement('div');
    btn.className='theme-btn'+(k===curType?' selected':'');
    btn.innerHTML=`<span class="te">${t.emoji}</span><span class="tl">${t.label}</span>`;
    if(!locked){
      btn.onclick=()=>{curType=k;D.type=k;D.themeMonth=thisMonth();save(D);renderHome();};
    } else {
      btn.style.opacity=k===curType?'1':'0.4';
      btn.style.cursor='default';
    }
    container.appendChild(btn);
  });
  document.getElementById('theme-title').textContent=locked?`🎨 今月のテーマ：${TYPES[curType].label}`:'🎨 今月のテーマをえらぼう';
  document.getElementById('theme-locked').textContent=locked?'来月になったら新しいテーマを選べるよ！':'えらんだら今月はこのテーマで練習しよう！';
}

function renderWeekGrid(){
  const grid=document.getElementById('week-grid');
  grid.innerHTML='';
  const now=new Date(),dow=now.getDay(),log=D.practiceLog||{};
  let weekDone=0;
  for(let i=0;i<7;i++){
    const d=new Date(now);d.setDate(now.getDate()-(dow-i));
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,isToday=i===dow,done=!!log[key];
    if(done&&d<=now) weekDone++;
    // その日のキャラを表示
    const col=D.collectionLog||{};
    const dayChar=col[key]?col[key].emoji:'';
    const cell=document.createElement('div');
    cell.className='day-cell';
    cell.innerHTML=`<div class="day-label">${DAYS_JA[i]}</div>
      <div class="day-circle ${done?'done':''} ${isToday&&!done?'today':''}">${done?dayChar:''}</div>`;
    grid.appendChild(cell);
  }
  const msg=document.getElementById('week-msg');
  if(weekDone>=7){msg.textContent='🎉 こんしゅうかんせい！';msg.style.cssText='color:var(--pink);font-weight:700;';}
  else{msg.textContent=`あと${7-weekDone}かいれんしゅうしたらこんしゅうかんせい！`;msg.style.cssText='color:var(--text-soft);';}
}

// ===== PRACTICE =====
function setMin(n){document.getElementById('minutes-input').value=n;updateFinBtn();}
function updateFinBtn(){
  const v=parseInt(document.getElementById('minutes-input')?.value||'0');
  document.getElementById('finish-btn').disabled=!(v>0);
}

function finishPractice(){
  const t=today(),log=D.practiceLog||{};
  const mins=parseInt(document.getElementById('minutes-input').value||'0');

  // 今日の合計分数を更新
  const dailyMins=D.dailyMins||{};
  dailyMins[t]=(dailyMins[t]||0)+mins;
  D.dailyMins=dailyMins;

  const totalToday=dailyMins[t];
  const rarity=getRarity(totalToday);
  const char=getRandomChar(curType,rarity);

  const already=!!log[t];
  log[t]=true;D.practiceLog=log;
  D.totalMinutes=(D.totalMinutes||0)+mins;

  // コレクションは毎回今日の合計分数で上書き更新
  const colLog=D.collectionLog||{};
  colLog[t]={emoji:char.e,name:char.n,rarity,mins:totalToday};
  D.collectionLog=colLog;

  if(!already){
    const yd=new Date();yd.setDate(yd.getDate()-1);
    const ys=yd.toISOString().slice(0,10);
    D.streak=(D.lastPractice===ys||D.lastPractice===t)?(D.streak||0)+1:1;
    D.lastPractice=t;
  }
  save(D);
  showCel(char,rarity,totalToday);
}

// ===== CELEBRATION =====
function showCel(char,rarity,totalToday){
  const rarityLabel={normal:'ふつう',rare:'✨ レア！',super:'💎 スーパーレア！！'}[rarity];
  const rarityColor={normal:'color:var(--text-soft)',rare:'color:#B07800;font-size:16px;',super:'background:linear-gradient(90deg,#FF8FAB,#C77DFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:18px;'}[rarity];

  document.getElementById('cel-char').textContent=char.e;
  document.getElementById('cel-rarity').innerHTML=`<span style="${rarityColor}">${rarityLabel}</span>`;
  document.getElementById('cel-name').textContent=char.n;
  document.getElementById('cel-msg').textContent=`きょうのごうけい${totalToday}ふん！つごうけい${D.totalMinutes}ふん🎉`;

  document.getElementById('celebration').classList.add('show');
  makeConfetti(rarity);
}
function hideCel(){document.getElementById('celebration').classList.remove('show');renderHome();}
function makeConfetti(rarity){
  const w=document.getElementById('confetti-wrap');w.innerHTML='';
  const count=rarity==='super'?80:rarity==='rare'?60:40;
  const cols=rarity==='super'?['#FF8FAB','#FFD166','#C77DFF','#06D6A0','#74B3CE','gold']:['#FF8FAB','#FFD166','#06D6A0','#C77DFF','#74B3CE'];
  for(let i=0;i<count;i++){
    const p=document.createElement('div');p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${cols[~~(Math.random()*cols.length)]};width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*1.5}s;`;
    w.appendChild(p);
  }
}

// ===== COLLECTION =====
function renderCollection(){
  D=getData();curType=D.type||'flower';
  const ct=TYPES[curType],scene=ct.scene;
  const colLog=D.collectionLog||{};
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();

  // 今月のコレクション（タイムゾーンずれ防止のため文字列で比較）
  const ymStr=`${yr}-${String(mo+1).padStart(2,'0')}`;
  const monthItems=Object.entries(colLog).filter(([key])=>key.startsWith(ymStr)).map(([,v])=>v);

  document.getElementById('col-title').textContent=scene.name;
  document.getElementById('col-sub').textContent=`れんしゅうするたびにキャラクターがもらえるよ！`;
  document.getElementById('col-scene-name').textContent=`${ct.emoji} 今月のコレクション`;
  document.getElementById('col-count').textContent=`${monthItems.length}こ`;

  // レアリティ説明をテーマに合わせて更新
  const chars=CHARS[curType];
  const legendEl=document.getElementById('rarity-legend-content');
  legendEl.innerHTML=`
    <div class="rarity-row">
      <span class="rarity-badge badge-normal">ふつう</span>
      <span style="font-size:12px;">10分未満</span>
      <span style="font-size:20px;margin-left:4px;">${chars.normal.map(c=>c.e).join('')}</span>
    </div>
    <div class="rarity-row">
      <span class="rarity-badge badge-rare">✨ レア</span>
      <span style="font-size:12px;">20分以上</span>
      <span style="font-size:20px;margin-left:4px;">${chars.rare.map(c=>c.e).join('')}</span>
    </div>
    <div class="rarity-row">
      <span class="rarity-badge badge-super">💎 スーパーレア</span>
      <span style="font-size:12px;">30分以上</span>
      <span style="font-size:20px;margin-left:4px;">${chars.super.map(c=>c.e).join('')}</span>
    </div>`;

  const box=document.getElementById('col-scene-box');
  box.style.background=scene.bg;
  if(monthItems.length===0){
    box.innerHTML=`<div style="text-align:center;padding:20px 0;color:${curType==='ocean'?'rgba(200,230,255,.8)':'#9B7FA6'};font-size:12px;line-height:1.8;">れんしゅうするとキャラクターがもらえるよ！<br>🎹 がんばってね！</div>`;
  } else {
    box.innerHTML=monthItems.map(item=>{
      const isSuper=item.rarity==='super';
      const isRare=item.rarity==='rare';
      const border=isSuper?'2px solid gold':isRare?'2px solid #FFD166':'none';
      const size=isSuper?'38px':isRare?'30px':'26px';
      return `<span class="scene-item" title="${item.name}" style="font-size:${size};border:${border};border-radius:50%;padding:2px;">${item.emoji}</span>`;
    }).join('');
  }

  // 月カレンダー
  const monthLabel=now.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});
  document.getElementById('cal-month-label').textContent=monthLabel;
  document.getElementById('cal-month-count').textContent=`${monthItems.length}かい`;

  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const firstDow=new Date(yr,mo,1).getDay();
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  ['日','月','火','水','木','金','土'].forEach(d=>{const l=document.createElement('div');l.className='cal-day-lbl';l.textContent=d;grid.appendChild(l);});
  for(let i=0;i<firstDow;i++) grid.appendChild(document.createElement('div'));
  for(let d=1;d<=daysInMonth;d++){
    const key=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const item=colLog[key],isToday=key===today();
    const cell=document.createElement('div');
    cell.className=`cal-day ${item?'done':''} ${isToday?'today-mark':''}`;
    cell.textContent=item?item.emoji:d;
    grid.appendChild(cell);
  }
}
</script>
